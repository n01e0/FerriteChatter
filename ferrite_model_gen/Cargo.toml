[package]
name = "ferrite_model_gen"
version = "0.6.2"
authors = ["n01e0 <reoshiseki@gmail.com>"]
edition = "2024"
description = "ChatGPT CLI"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
quote = "1.0.47"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.10", features = ["full"] }
tokio = { version = "1.54.1", features = ["full"] }

[lib]
proc-macro = true
