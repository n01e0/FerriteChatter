[package]
name = "FerriteChatter"
version = "9.5.0"
authors = ["n01e0 <reoshiseki@gmail.com>"]
edition = "2024"
description = "ChatGPT CLI"
license = "MIT"
readme = "README.md"

[[bin]]
name = "fchat"
path = "src/bin/fchat.rs"

[[bin]]
name = "fask"
path = "src/bin/fask.rs"

[[bin]]
name = "ftrans"
path = "src/bin/ftrans.rs"

[[bin]]
name = "fimg"
path = "src/bin/fimg.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version="4.6.7", features=["derive"] }
inquire = { version="0.9.4", features=["editor"] }
openai = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tia = "1.0.3"
tokio = { version="1.54.1", features=["full"] }
ferrite_model_gen = "0.6.1"
rand = { version = "0.10", features = ["std"] }
serde_json = "1.0"
viuer = { version = "0.11", features = ["print-file"] }
base64 = "0.23"
reqwest = { version = "0.13.5", features = ["json", "rustls", "multipart", "query", "stream"] }
futures-util = "0.3"
